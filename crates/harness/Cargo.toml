[package]
name = "harness"
version = "0.1.0"
description = "Gossamr's agent harness: a program beside the app that runs agent sessions"
authors = ["Alf Henderson"]
edition = "2024"
# `File::try_lock` is stable from 1.89.
rust-version = "1.89"
publish = false

[dependencies]
aho-corasick = "1.1.5"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
getrandom = "0.4.3"
hmac = "0.12.1"
libc = "0.2.189"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "test-util"] }
