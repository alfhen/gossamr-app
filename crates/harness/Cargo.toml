[package]
name = "harness"
version = "0.1.0"
description = "Gossamr's agent harness: a program beside the app that runs agent sessions"
authors = ["Alf Henderson"]
edition = "2024"
# `File::try_lock` is stable from 1.89.
rust-version = "1.89"
publish = false

[dependencies]
aho-corasick = "1.1.5"
getrandom = "0.4.3"
libc = "0.2.189"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "test-util"] }
