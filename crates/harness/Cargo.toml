[package]
name = "harness"
version = "0.1.0"
description = "Gossamr's agent harness: a program beside the app that runs agent sessions"
authors = ["Alf Henderson"]
edition = "2024"
publish = false

[dependencies]
getrandom = "0.4.3"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
