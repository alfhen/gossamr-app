name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # generate_context! embeds the frontend dist, so it has to exist for the app crate to compile.
      - run: mkdir -p dist
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The harness has to build and pass on Linux, where it will also run. It needs neither the app nor dist/.
  harness-linux:
    name: harness (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p harness --all-targets -- -D warnings
      - run: cargo test -p harness

  # The browser tests, split four ways so a full run takes about a quarter as long. Each shard keeps the config's one worker:
  # the mock paces its answers on timers.
  e2e:
    # A named image, so a new ubuntu-latest can't take away the browsers this Playwright version supports. Move it
    # together with @playwright/test (1.61 is the first to support Ubuntu 26.04).
    runs-on: ubuntu-24.04
    # It runs the pull request's own code, so its token can only read and checkout keeps no credential on disk.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e --shard=${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7
