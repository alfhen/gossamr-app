name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The app's bundle carries the harness, so it is built first, as `tauri build` does (scripts/stage-harness.sh).
      - run: TAURI_ENV_DEBUG=true sh scripts/stage-harness.sh && test -x target/sidecar/harness
      # generate_context! embeds the frontend dist, so it has to exist for the app crate to compile.
      - run: mkdir -p dist
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The harness's `testing` feature is on only where the app's tests are built. A release build has no dev-dependencies,
      # so anything of the app's own code that leans on that feature fails here.
      - run: cargo check -p gossamr --release
      # The file vault of debug builds (GOSSAMR_TEST_VAULT), their mock switch (GOSSAMR_MOCK_SCRIPT) and their app data
      # folder (GOSSAMR_APP_DATA) are under cfg(debug_assertions): a release binary has no trace of them.
      # (`strings -a`: macOS grep does not match inside this binary.) A debug build of the app does hold the name. The strings
      # go to a file that must not be empty, so a missing binary or a failed `strings` fails the step instead of passing it.
      - run: |
          set -eu
          cargo build -p gossamr --release
          strings -a target/release/gossamr > "$RUNNER_TEMP/release-strings.txt"
          test -s "$RUNNER_TEMP/release-strings.txt"
          grep -q 'gossamr' "$RUNNER_TEMP/release-strings.txt"
          if grep -q GOSSAMR_TEST_VAULT "$RUNNER_TEMP/release-strings.txt"; then echo "the release build holds the test vault"; exit 1; fi
          if grep -q GOSSAMR_MOCK_SCRIPT "$RUNNER_TEMP/release-strings.txt"; then echo "the release build holds the mock switch"; exit 1; fi
          if grep -q GOSSAMR_APP_DATA "$RUNNER_TEMP/release-strings.txt"; then echo "the release build holds the app data switch"; exit 1; fi

  # The harness has to build and pass on Linux, where it will also run. It needs neither the app nor dist/.
  harness-linux:
    name: harness (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p harness --all-targets -- -D warnings
      - run: cargo test -p harness
      # Without the `testing` feature, as the app's release build and the sidecar use it.
      - run: cargo build -p harness --release

  # The browser tests, split four ways so a full run takes about a quarter as long. Each shard keeps the config's one worker:
  # the mock paces its answers on timers.
  e2e:
    # A named image, so a new ubuntu-latest can't take away the browsers this Playwright version supports. Move it
    # together with @playwright/test (1.61 is the first to support Ubuntu 26.04).
    runs-on: ubuntu-24.04
    # It runs the pull request's own code, so its token can only read and checkout keeps no credential on disk.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e --shard=${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7
