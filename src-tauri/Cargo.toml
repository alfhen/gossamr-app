[package]
name = "jira-inbox"
version = "0.1.0"
description = "A keyboard-first Jira inbox for macOS"
authors = ["Alf Henderson"]
edition = "2021"


[lib]
name = "jira_inbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["net", "io-util", "time", "sync", "macros", "rt", "process"] }
url = "2.5.8"
thiserror = "2.0.21"
keyring = { version = "3", features = ["apple-native"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "multipart"] }
getrandom = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
tauri-plugin-notification = "2.5.0"
axum = "0.8.9"
dirs = "7.0.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
